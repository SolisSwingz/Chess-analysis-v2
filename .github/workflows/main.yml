name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ChessArrows.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: bash get_stockfish.sh
        working-directory: ChessArrows
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: ChessArrows
      - uses: actions/upload-artifact@v4
        with:
          name: chess-arrows-debug-apk
          path: ChessArrows/app/build/outputs/apk/debug/app-debug.apk
